<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Web 工作站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #252526;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 90%;
    }
    h1 { margin-bottom: 10px; font-size: 24px; color: #61afef; }
    p { margin-bottom: 30px; font-size: 14px; color: #abb2bf; }
    .btn-group { display: flex; flex-direction: column; gap: 15px; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.2s ease;
    }
    .btn-vscode { background-color: #007acc; color: #ffffff; }
    .btn-vscode:hover { background-color: #005999; }
    .btn-webvm { background-color: #28a745; color: #ffffff; }
    .btn-webvm:hover { background-color: #218838; }
  </style>
</head>
<body>
  <div class="card">
    <h1>我的 Cloud 工作站</h1>
    <p>請選擇您要開啟的工具：</p>
    <div class="btn-group">
      <a href="https://vscode.dev" target="_blank" class="btn btn-vscode">🚀 開啟 VS Code Web</a>
      <a href="https://webvm.io" target="_blank" class="btn btn-webvm">🖥️ 開啟 WebVM Linux 終端機</a>
    </div>
  </div>
</body>
</html>
